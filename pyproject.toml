[project]
name = "business-rag"
version = "0.1.0"
description = "Project for building a business RAG (Retrieval-Augmented Generation) system using LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.12",
    "langsmith>=0.14.4",
    "ollama>=0.6.3",
    "openai>=3.24.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = []
